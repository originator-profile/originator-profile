<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Link Verification Test</title>
    <!-- modified -->
    <style>
      iframe {
        width: 300px;
        height: 200px;
        border: 1px solid #ccc;
        margin: 10px;
      }
    </style>
  </head>

  <body>
    <h1>Link Verification Test</h1>
    <div>
      <h2>Valid Case</h2>
      <p>
        Target OPID matches the destination site
        (dns:demo.exp.originator-profile.org)
      </p>
      <iframe
        srcdoc='<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Valid OpMeta Ad</title>
</head>
<body>
  <script type="application/opmeta+json">
    {
      "targetopid": "dns:demo.exp.originator-profile.org"
    }
  </script>
  <div style="padding: 20px; background: #e0f7fa; text-align: center;">
    <p>Valid Ad</p>
    <a href="/ja/" target="_top">Click for Valid Transition</a>
  </div>
</body>
</html>'
      ></iframe>
    </div>
    <div>
      <h2>Invalid Case</h2>
      <p>Target OPID mismatch (dns:invalid.example.com)</p>
      <iframe
        srcdoc='<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Invalid OpMeta Ad</title>
</head>
<body>
  <script type="application/opmeta+json">
    {
      "targetopid": "dns:invalid.example.com"
    }
  </script>
  <div style="padding: 20px; background: #ffebee; text-align: center;">
    <p>Invalid Ad</p>
    <a href="/ja/" target="_top">Click for Invalid Transition</a>
  </div>
</body>
</html>'
      ></iframe>
    </div>
  </body>
</html>
