name: release
run-name: "${{ inputs.version }}"
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        default: beta
        required: true
        type: choice
        options:
          - release
          - beta
      version:
        description: 'Increment "major", "minor", "patch", "prerelease" or "pre*" version; or specify version'
        default: prerelease
        required: true
jobs:
  main:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v')
    environment:
      name: release
      url: ${{ steps.build.outputs.artifact-url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup
        uses: "./.github/actions/setup"
      - name: Bump version
        run: |
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config user.name "${GITHUB_ACTOR}"
          git config core.hooksPath .githooks
          pnpm exec lerna version --yes "${{ github.event.inputs.version }}"
      - name: Build
        id: build
        uses: "./.github/actions/build"
        with:
          BASIC_AUTH_CREDENTIALS: ${{ secrets.BASIC_AUTH_CREDENTIALS }}
          REGISTRY_OPS: ${{ secrets.REGISTRY_OPS }}
      - name: Build for WordPress plugin
        uses: "./.github/actions/wordpress_build"
      - if: github.event.inputs.release_type == 'release'
        name: Publish Packages
        run: pnpm publish --recursive --publish-branch "${CURRENT_BRANCH}"
        env:
          CURRENT_BRANCH: ${{ github.ref_name }}
      - if: github.event.inputs.release_type == 'beta'
        name: Publish Beta Packages
        run: pnpm publish --recursive --tag=beta --publish-branch "${CURRENT_BRANCH}"
        env:
          CURRENT_BRANCH: ${{ github.ref_name }}
      - if: github.ref == 'refs/heads/main' && github.event.inputs.release_type == 'release' && github.event.inputs.version != 'prerelease'
        name: Next Release
        run: |
          pnpm exec lerna version --preid=beta --yes preminor
