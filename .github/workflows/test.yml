name: originator-profile/profile/test
on: push
jobs:
  main:
    environment:
      name: test
      url: ${{ steps.build.outputs.artifact-url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    # format ステップで新しいコミットを push するために write 権限を与える
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install fonts for VRT
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f -v
      - name: Setup
        uses: "./.github/actions/setup"
      - name: Format
        uses: "./.github/actions/format"
      - name: Lint
        uses: "./.github/actions/lint"
      - name: Type Check
        uses: "./.github/actions/type-check"
      - name: Test
        uses: "./.github/actions/test"
      - name: Build
        id: build
        uses: "./.github/actions/build"
        with:
          BASIC_AUTH_CREDENTIALS: ${{ secrets.BASIC_AUTH_CREDENTIALS }}
          REGISTRY_OPS: ${{ secrets.REGISTRY_OPS }}
      - name: End-to-End Test
        uses: "./.github/actions/e2e"
