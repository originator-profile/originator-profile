name: Update VRT Baselines
on:
  workflow_dispatch:
jobs:
  update-baselines:
    environment:
      name: test
      url: ${{ steps.build.outputs.artifact-url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install fonts for VRT
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f -v

      - name: Setup
        uses: "./.github/actions/setup"

      - name: Build
        id: build
        uses: "./.github/actions/build"
        with:
          BASIC_AUTH_CREDENTIALS: ${{ secrets.BASIC_AUTH_CREDENTIALS }}
          REGISTRY_OPS: ${{ secrets.REGISTRY_OPS }}

      - name: Update VRT baseline screenshots
        run: pnpm e2e:update
        shell: bash

      - name: Check for changes
        id: check_changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to baseline screenshots"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Baseline screenshots have been updated"
          fi
        shell: bash

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: |
            chore: update VRT baseline screenshots

            🤖 Generated with GitHub Actions
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}
          title: "chore: update VRT baseline screenshots"
          body: |
            ## VRT Baseline Screenshots Updated

            This PR updates the Visual Regression Testing baseline screenshots.

            **Workflow:** ${{ github.workflow }}
            **Run ID:** ${{ github.run_id }}
            **Triggered by:** @${{ github.actor }}

            🤖 This PR was automatically generated by GitHub Actions.
          branch: vrt-baseline-update/${{ github.run_id }}
          delete-branch: true
          signoff: true

      - name: Upload updated baselines as artifact
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: vrt-baselines
          path: |
            apps/web-ext/e2e/**/*-snapshots/
            packages/verify/e2e/**/*-snapshots/
          retention-days: 30

      - name: Summary
        run: |
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "### ✅ VRT Baseline Screenshots Updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Updated baseline screenshots have been committed to the current branch." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Changed files:**" >> $GITHUB_STEP_SUMMARY
            git diff HEAD~1 --name-only | grep -E '\-snapshots/.*\.png$' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || echo "- No screenshot changes found" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ℹ️ No Changes to VRT Baselines" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No changes were detected in the baseline screenshots." >> $GITHUB_STEP_SUMMARY
          fi
        shell: bash
