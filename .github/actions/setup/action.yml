name: setup
description: Setup
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version-file: .node-version
        cache: pnpm
        registry-url: "https://registry.npmjs.org"
        scope: "@originator-profile"
    - name: Get Playwright version
      id: playwright-version
      run: |
        PLAYWRIGHT_VERSION=$(pnpm why --filter @originator-profile/inspector --json playwright | jq -r '.[].version')
        if [ -z "$PLAYWRIGHT_VERSION" ]; then
          echo "Error: Failed to detect Playwright version" >&2
          exit 1
        fi
        echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Restore Playwright cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.cache/ms-playwright
        key: "${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}"
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
    - name: Install Playwright browsers and system dependencies
      run: pnpm --filter @originator-profile/inspector exec playwright install --with-deps
      shell: bash
