name: e2e
description: End-to-End Test
runs:
  using: composite
  steps:
    - name: E2E tests
      run: pnpm e2e
      shell: bash
    - name: テスト結果の保存(失敗時レポート)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: failure()
      with:
        name: e2e-report
        path: |
          packages/verify/playwright-report
          packages/verify/test-results
          apps/inspector/playwright-report
          apps/inspector/test-results
          apps/inspector/screenshots
        retention-days: 7
