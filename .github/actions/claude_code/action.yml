name: claude code
description: |
  claude code

  expected triggers:
    issue_comment:
      types: [created]
    pull_request_review_comment:
      types: [created]
    issues:
      types: [opened, assigned]
    pull_request_review:
      types: [submitted]
  expected permissions:
    contents: write 
    pull-requests: write
    issues: write
    id-token: write
    actions: read
  expected job conditions: |
    (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
    (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
    (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
    (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
inputs:
  CLAUDE_CODE_OAUTH_TOKEN:
    description: Claude Code OAuth Token
    required: true

runs:
  using: composite
  steps:
    - name: Run Claude Code
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.CLAUDE_CODE_OAUTH_TOKEN }}
        track_progress: true
        claude_args: |
          --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git add *),Bash(git commit *),Bash(git push origin *)" --disallowedTools "Bash(git push *--force*),Bash(git push *-f *),Bash(git push *-f)"
